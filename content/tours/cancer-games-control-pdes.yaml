# Guided tour. Format: docs/FORMAT.md ("Tours"). Bibliography also feeds scripts/mine-literature.mjs.
title: Cancer through games, control and PDEs
subtitle: A guided tour of the mathematics of cancer evolution and treatment, 1825–2026
intro: |
  Mathematical oncology has four or five traditions that rarely cite each other: growth laws and the
  first optimal-control problems, stochastic models of somatic evolution, evolutionary game theory,
  phenotype-structured PDEs with constrained Hamilton–Jacobi limits, and the spatial and mechanical PDEs of
  tumour growth. Treatment design, adaptive therapy in particular, is where they meet. The chapters below
  run roughly in historical order, each holding a cluster of notes; the **Timeline** tab lists the papers
  by year, and **Open questions** collects what the field says it does not know, with the mathematical
  gaps a PDE or mean-field-games specialist could work on. Read a chapter, practise it, then move on.
chapters:
  - id: growth-and-control
    title: Growth laws and the first control problems
    period: 1825–1999
    intro: >
      Before anyone modelled resistance or evolution, tumours were curves. Gompertz's 1825 mortality law,

      fitted to tumours by Laird in 1964, became the default growth model, and the log-kill and

      Norton–Simon hypotheses turned it into scheduling advice. Swan and Vincent (1977) applied

      Pontryagin's principle to a human cancer for the first time, and by 1992 Martin's benchmark

      problem had every ingredient of modern work: state constraints, toxicity, and a resistant subpopulation

      whose presence makes keeping a *large* tumour optimal. The notes here are the vocabulary for everything
      after.
    stops:
      - note: tumor-growth-laws
        why: The one-dimensional growth laws (Gompertz above all) that every scheduling principle and control problem
          in the tour is built on, and how badly their choice propagates into predictions.
      - note: kill-laws-and-scheduling-principles
        why: "How the drug enters the equation: Skipper's log-kill versus the Norton–Simon kill law, and the first
          scheduling disputes (dose density, alternating versus sequential drugs)."
      - note: chemotherapy-optimal-control-origins
        why: The first Pontryagin and nonlinear-programming treatments of chemotherapy, the bang-bang/singular-arc
          machinery, and why their schedules are artefacts of the cost and of unidentifiable parameters.
  - id: stochastic-evolution
    title: Cancer as somatic evolution
    period: 1943–2026
    intro: |
      Nowell's 1976 picture of a tumour as a Darwinian population made resistance a question about mutation,
      selection and chance. The tools are branching processes and generating functions: Luria–Delbrück
      jackpots, Armitage–Doll power laws, the Goldie–Coldman argument for early treatment, the
      Nowak–Michor–Iwasa calculations of when resistance pre-exists, Bozic's result on combination versus
      sequential therapy, and the Scott group's attempts to steer evolution with drug sequences.
    stops:
      - note: cancer-somatic-evolution
        why: "The reframing the whole chapter rests on: a tumour is a population under Darwinian selection, with
          drivers, passengers and fixation."
      - note: multistage-carcinogenesis
        why: "Why cancer takes decades, read off a registry curve: the Armitage-Doll power law, two-stage clonal
          expansion, and waiting times that depend on selection far more than on mutation rate or population
          size."
      - note: pre-existing-resistance
        why: "The Luria-Delbruck calculation in its simplest form: the mean $\\mu N\\ln N$, the probability $e^{-\\mu
          N}$, and why therapy reveals rather than causes resistance."
      - note: branching-process-resistance
        why: The same calculation with cell death, several drugs and a dose schedule, where generating functions
          become a first-order PDE solved by characteristics.
      - note: neutral-evolution-debate
        why: Can selection be detected in one bulk sample? The $1/f$ test, its 2018 critics, and the spatial models
          that produce neutral-looking data without neutrality.
      - note: evolutionary-steering-collateral-sensitivity
        why: "If resistance is inevitable, steer it: non-commuting Markov matrices on fitness landscapes, a provably
          early switching time, and the clinical rarity that threatens the programme."
  - id: evolutionary-games
    title: Evolutionary games among cells
    period: 1997–2026
    intro: |
      Tomlinson (1997) wrote the first payoff matrix for cancer cells. Since then the field has used matrix
      games and replicator dynamics, public-goods games for diffusible factors, G-functions for continuous
      traits, spatial games, and, most recently, experiments that *measure* the game instead of assuming it.
      The physician enters as a Stackelberg leader whose follower is not rational but evolving.
    stops:
      - note: tomlinson-matrix-games
        why: "Where cancer game theory started: phenotypes as strategies, heterogeneity as a mixed equilibrium, and
          the critiques that set the agenda."
      - note: cancer-public-goods-games
        why: Diffusible goods make the game N-player; a sigmoid benefit explains coexistence, and two goods can make
          the tumour cycle.
      - note: g-functions-darwinian-dynamics
        why: The continuous-trait machinery (G-functions, ESS maximum principle, double bind) that every Stackelberg
          therapy model is built on.
      - note: measuring-the-game
        why: The game assay turns payoffs from postulates into measurements, and shows what remains unidentified.
      - note: spatial-games-in-tumours
        why: "What structure does and does not do: edges change the effective game, and space does not reliably rescue
          cooperation."
      - note: stackelberg-evolutionary-games
        why: "The physician as leader against an evolving follower: the one theorem, a worked example, and the bilevel
          structure left open."
  - id: adaptive-therapy
    title: Adaptive therapy and containment
    period: 2009–2026
    intro: |
      Gatenby's 2009 proposal to treat for stability rather than cure, letting sensitive cells suppress
      resistant ones, produced the first evolution-based clinical trial (prostate cancer, 2017) and a
      theory: containment theorems, dynamic-programming solutions on the simplex, extinction strategies,
      and multidrug cycles. This is the chapter where control theory and evolutionary games meet the clinic.
    stops:
      - note: adaptive-therapy-origins
        why: "Where the idea came from: competitive release, the mouse experiments, and the three-type prostate model
          that the trial and every later optimisation use."
      - note: adaptive-therapy-control
        why: The two-type toy model, the composition identity, why maximum dose backfires, the time-to-failure bound
          and the Pontryagin structure.
      - note: tumour-containment-theory
        why: "The theorems: comparison arguments showing that holding the burden at the tolerable level maximises time
          to progression, under the single hypothesis that sensitive cells slow resistant growth."
      - note: adaptive-therapy-dynamic-programming
        why: "The feedback picture: exit-time HJB on the simplex, bang-bang switching curves, a stochastic
          probability-of-success objective, and the viability sets that say what is controllable at all."
      - note: extinction-therapy-two-strikes
        why: "The opposite programme: strike while the population is small, with extinction probability as the
          objective, which forces a stochastic formulation."
      - note: multidrug-adaptive-scheduling
        why: "What happens with more than one agent: evolutionary cycles and absorbing regions on the replicator
          simplex, and the entropy argument for low-dose metronomic schedules."
  - id: control
    title: Geometric optimal control of therapy
    period: 2000–2026
    intro: |
      The Ledzewicz–Schättler school turned chemotherapy scheduling into geometric optimal control: Lie
      brackets, Legendre–Clebsch conditions and complete syntheses that say when the optimal dose is
      bang-bang (maximum tolerated dose) and when a singular arc (metronomic, reduced dose) takes over.
      Drug-induced resistance, radiotherapy fractionation and the numerical methods complete the picture.
    stops:
      - note: anti-angiogenic-optimal-control
        why: "The one therapy model whose optimal controls are classified completely, by Lie-bracket computations: a
          theorem-level synthesis, and a worked example of how a singular arc appears or disappears with the
          model variant."
      - note: bang-bang-singular-metronomic
        why: Turns the clinical MTD-versus-metronomic question into the geometric one, bang-bang versus singular arc,
          and shows which modelling ingredients flip the answer.
      - note: drug-induced-resistance-control
        why: When the dose itself creates resistance, the Legendre–Clebsch sign reverses and containment (a boundary
          arc) replaces metronomic dosing (a singular arc); also where identifiability enters.
      - note: radiotherapy-fractionation-control
        why: "The discrete half of the chapter: the linear-quadratic model gives a closed-form criterion for
          hypofractionation, which biological structure and parameter uncertainty then break."
      - note: numerical-optimal-control-methods
        why: How these schedules are actually computed — direct, indirect, HJB, ensemble — and why the objective
          functional and identifiability, not the solvers, are the bottleneck.
  - id: phenotype-structured
    title: Phenotype-structured populations and constrained Hamilton–Jacobi equations
    period: 2005–2026
    intro: |
      Resistance as a continuous trait leads to selection–mutation PDEs whose small-mutation limit is a
      Hamilton–Jacobi equation with a constraint and an unknown Lagrange multiplier. This is the chapter
      closest to viscosity solutions and asymptotic analysis: uniqueness theory, the Clairambault–Lorenzi
      resistance models, Pouchol's optimal control of the integro-differential system, space-and-trait
      models, and the cell-cycle and chronotherapy models of the same school.
    stops:
      - note: selection-mutation-hamilton-jacobi
        why: "The basic mechanism: Hopf–Cole, the constraint $\\max u=0$, the multiplier and Dirac concentration."
      - note: constrained-hj-uniqueness-regularity
        why: "What is actually proved: BV multipliers that jump, concavity, Calvez–Lam uniqueness, and an
          asymptotic-preserving scheme."
      - note: lorz-clairambault-resistance-model
        why: The founding cancer model with a continuous resistance trait, its theorems, and the exact Gaussian
          solutions.
      - note: pouchol-optimal-control-ide
        why: "The one optimal-control theorem on the trait-structured system: induce sensitivity, then strike."
      - note: space-and-trait-models
        why: Spheroids, the two rigorous concentration theorems with space, invasion fronts, and periodic
          environments.
      - note: persisters-phenotypic-switching
        why: "Reversible, non-genetic resistance: discrete switching versus continuous traits with advection, and what
          it says about dosing."
      - note: cell-cycle-chronotherapy
        why: "The linear, age-structured half: Floquet versus Perron eigenvalues as the mathematics of chronotherapy."
  - id: tumor-immune
    title: Tumour–immune dynamics and leukaemia
    period: 1980–2026
    intro: |
      Immune predation gives bistable ODEs (Kuznetsov 1994), and therapy becomes a problem of crossing a
      separatrix. Chronic myeloid leukaemia is the best-measured cancer in the field, with a twenty-year
      dispute over stem-cell models settled by data and models that now predict who can stop treatment.
      CAR-T and checkpoint models, and immune evasion as a game, close the chapter.
    stops:
      - note: kuznetsov-tumour-immune-model
        why: The planar tumour–effector phase portrait (dormant focus, saddle, escape) that every later immune model
          and control problem builds on, with the Kuznetsov equilibria recomputed.
      - note: immunotherapy-optimal-control
        why: "Pontryagin on bistable tumour–immune models: the target is a basin, and the optimal schedule is full
          dose, singular arc, then nothing."
      - note: cml-dynamics-treatment-free-remission
        why: "The best-measured cancer: biphasic decline, the Michor–Roeder dispute settled by ten-year data, and
          immune-window bistability turned into a rule for stopping therapy."
      - note: immune-evasion-games-car-t
        why: "Evolution and noise enter: evasion as a two-phenotype game, and CAR-T models where cure is a stochastic
          extinction event."
      - note: leukaemia-stem-cell-models
        why: Feedback on self-renewal, clonal selection by self-renewal rather than speed, trait-structured
          concentration, and delay-driven periodic disease.
  - id: spatial-mechanical
    title: Space and mechanics
    period: 1972–2026
    intro: |
      Greenspan's 1972 spheroid started the free-boundary tradition that Friedman made rigorous; Perthame,
      Quirós and Vázquez (2014) showed that stiff-pressure tumour models become Hele-Shaw problems, with an
      unbalanced-optimal-transport gradient-flow structure behind them. Separately, reaction–diffusion
      glioma models became clinical tools calibrated from MRI, and the "digital twin" programme asks how
      much a PDE can be personalised from two scans.
    stops:
      - note: greenspan-free-boundary-models
        why: "The sharp-interface ancestor of every spatial model: quasi-steady nutrient, Darcy pressure, surface
          tension, and the complete rigorous picture of radial states and their symmetry-breaking."
      - note: hele-shaw-limit-tumour-growth
        why: "How a density model with stiff pressure becomes a free-boundary problem: the complementarity relation,
          the Aronson–Bénilan estimate, and a decade of weakened hypotheses."
      - note: tumour-growth-unbalanced-transport
        why: The same model as a gradient flow in the Hellinger–Kantorovich metric, with the JKO and splitting schemes
          written out and the link to density-constrained MFG.
      - note: phase-field-and-mixture-models
        why: Where the closures come from (mixture theory, solid stress) and the one place in spatial oncology where
          optimal control is fully rigorous (Cahn–Hilliard models).
      - note: glioma-reaction-diffusion-personalisation
        why: "The most clinically used PDE in oncology: two parameters from two scans, a Fisher–KPP front, and an
          eikonal limit the reader already knows from Hamilton–Jacobi theory."
      - note: invasion-and-angiogenesis-models
        why: Reaction–diffusion fronts for invasion (acid, proteases, adhesion) and the hybrid random-walk model of
          angiogenesis; the mechanistic root of the acid-mediated game.
      - note: metastasis-models
        why: A size-structured McKendrick equation with a self-seeding boundary condition, calibrated on mice and
          patients, beside branching and Markov-chain views of spread.
      - note: digital-twins-oncology
        why: What is actually estimated from what imaging data when a PDE tumour model is personalised, and the
          identifiability gap that remains.
  - id: clinical
    title: Where the field stands
    period: 2009–2026
    intro: |
      What the trials showed, what the critics said, and the field's own lists of open questions
      (the 2019 roadmap and the 2023 survey of adaptive therapy). The landscape note maps the four
      research threads and the niche a mean-field-games researcher might fill.
    stops:
      - note: adaptive-therapy-trials-evidence
        why: What the adaptive-therapy trials actually reported, and the two distinct kinds of objection — statistical
          design versus the choice of objective functional.
      - note: mathematical-oncology-landscape
        why: The complementary map of the same field sorted by mathematical tool rather than by clinical question,
          including the mean-field Stackelberg niche.
      - note: field-open-questions
        why: "The reader's map for finding research problems: West 2023's eleven questions, the 2019 roadmap's
          challenges, and the mathematical gaps between them."
  - id: mean-field-and-beyond
    title: Mean field games and the frontier
    period: 2012–2026
    intro: |
      As of 2026 there is no peer-reviewed mean field game for cancer. This chapter records exactly what
      exists (a workshop abstract, some differential games, control-of-evolution papers), which pieces of
      major–minor and mean-field-control theory could be imported, and what an honest formulation of
      adaptive therapy as a game between a clinician and an evolving population would require.
    stops:
      - note: mean-field-games-in-oncology
        why: "Where the tour meets the reader's own field: what a cancer MFG would need, and why nothing peer-reviewed
          exists yet."
      - note: control-of-evolving-populations
        why: The population-genetics control thread (Bellman on Wright–Fisher, counterdiabatic driving) and the
          missing HJB on a space of measures.
open_questions:
  - title: Is there a theorem selecting Gompertz?
    body: >-
      Burton (1966, diffusion-limited nutrient), Kendal (1985, heterogeneous exponential subclones) and
      Gyllenberg–Webb (1989, quiescence)

      each produce Gompertz-like aggregate growth from a different mechanism, and Gerlee (2013) calls the
      situation a muddle.

      No classification result states under which hypotheses a structured or spatial population model has
      Gompertz, rather than

      power-law or generalised-logistic, dynamics as an exact or asymptotic law. Benzekry et al. (2014) show
      that only two-parameter laws

      are identifiable from typical data, so the question cannot be settled by fitting alone.
    chapter: growth-and-control
    notes:
      - tumor-growth-laws
    status: open
  - title: Is dose density optimal under the Norton–Simon kill law?
    body: >-
      Every classical optimal-control paper (Swan, Murray, Martin, Swierniak, Ledzewicz–Schättler) uses the
      log-kill term $-kuN$.

      The Norton–Simon law, the one with clinical confirmation (CALGB 9741, Simon–Norton 2006), multiplies the
      whole growth term,

      $\dot N = f(N)(1 - ku)$, and in the variable $y = \ln(K/N)$ it is bilinear with $N(T)$ depending only on
      the total dose.

      No Pontryagin or HJB analysis of this kill law with a toxicity state constraint was found as of 2026;
      the bang-bang/singular

      classification for log-kill does not transfer because the Lie brackets change.
    chapter: growth-and-control
    notes:
      - kill-laws-and-scheduling-principles
      - chemotherapy-optimal-control-origins
    status: open
  - title: Rigorous optimality theory for the state-constrained Gompertz benchmark
    body: >-
      Martin (1992) and Martin et al. (1990) impose constraints on drug concentration, cumulative exposure and
      tumour size at intermediate

      checkpoints and solve by nonlinear programming; the problem is still used as a numerical benchmark.
      Murray (1990) handled one pure

      state constraint by the maximum principle with boundary arcs, and Ledzewicz–Schättler treat
      unconstrained problems geometrically,

      but no existence, uniqueness or boundary-arc characterisation for the three-constraint Gompertz problem
      was found.
    chapter: growth-and-control
    notes:
      - chemotherapy-optimal-control-origins
    status: open
  - title: Control under superlinear growth with finite-time blow-up
    body: >-
      Pérez-García et al. (2020) fit $\dot V = \alpha V^{\beta}$ with $\beta > 1$ to human longitudinal
      imaging, which blows up at

      $t_{\rm crit} = t_0 + V_0^{1-\beta}/(\alpha(\beta - 1))$. No chemotherapy control problem uses this law;
      with it the terminal cost can be

      infinite for insufficient control and the value function has a blow-up barrier, suggesting a viability
      or barrier-HJB formulation.

      The authors themselves note that real tumours cannot follow the law to the singularity and that the
      regularising mechanism is unmodelled.
    chapter: growth-and-control
    notes:
      - tumor-growth-laws
      - chemotherapy-optimal-control-origins
    status: open
  - title: How does growth-law misspecification change the structure of optimal schedules?
    body: >-
      Murphy, Jaafari and Dobrovolny (2016) show a 6-fold spread in the chemotherapy needed across growth laws
      fitted to the same data,

      and González Vázquez–Villaverde (2025) give structural identifiability for twenty models, but no paper
      computes how the number of

      switches, the presence of singular arcs or the boundary-arc structure of the optimal control changes
      across growth laws fitted to one dataset.
    chapter: growth-and-control
    notes:
      - tumor-growth-laws
      - chemotherapy-optimal-control-origins
    status: open
  - title: How many mutations confer resistance to both drugs of a pair?
    body: |-
      The whole conclusion of Bozic et al. (2013) — that simultaneous dual therapy is curative while
      sequential therapy never is — turns on $n_{12}$, the number of mutations conferring resistance to both
      drugs, because $n_{12}=0$ makes double resistance a second-order event in the mutation rate. No
      systematic experimental programme estimating $n_{12}$ for approved drug pairs surfaced in the 2026
      survey. Until it exists, the result is a conditional statement whose condition is unknown in practice.
    chapter: stochastic-evolution
    notes:
      - branching-process-resistance
    status: open
  - title: A likelihood-based test of neutral tumour evolution
    body: |-
      Williams et al. (2016) test neutrality by least-squares fitting the cumulative VAF spectrum against
      $1/f$ with an $R^2\ge0.98$ cut-off, which the 2018 comments (Tarabichi et al.; Balaparya and De;
      McDonald, Chakrabarti and Michor) dispute on grounds of specificity. Rigorous limit laws for
      clone-size distributions do exist (Durrett and Moseley 2010; Leder et al. 2024). A likelihood-based
      neutrality test derived from the actual limit law, with the sequencing-depth detection limit modelled,
      is still missing and would arguably have pre-empted the exchange.
    chapter: stochastic-evolution
    notes:
      - neutral-evolution-debate
    status: open
  - title: Pontryagin theory for schedule optimisation over a branching process
    body: |-
      Foo and Michor (2009, 2010) observe numerically that the schedule minimising the probability of
      resistance always lies on the toxicity constraint curve, and that the constraint's convexity decides
      whether the optimum is pulsed or continuous. Neither statement is a theorem. There is no
      existence/uniqueness or bang-bang characterisation for minimising a functional of a non-homogeneous
      multitype branching process over a convex set of admissible dose schedules, and no proof of how the
      optimiser's structure switches with the constraint's geometry.
    chapter: stochastic-evolution
    notes:
      - branching-process-resistance
      - evolutionary-steering-collateral-sensitivity
    status: open
  - title: Predicting the distribution of collateral outcomes
    body: |-
      Nichol et al. (2019) showed that replicate populations evolved under the same first drug meet the
      second drug with either collateral sensitivity or cross-resistance, and conclude that
      evolution-informed therapy requires "a probabilistic understanding of the contingencies". Casier et
      al. (2026) frame the mechanism — stochastic events versus environment versus genetic background — as
      open, and Tandar et al. (2026) show the clinical base rate is only $3.0\%$. The open problem is to
      predict the *distribution* of collateral outcomes well enough to schedule on it.
    chapter: stochastic-evolution
    notes:
      - evolutionary-steering-collateral-sensitivity
    status: open
  - title: Control formulations ignore spatial structure
    body: |-
      Noble et al. (2022) show that spatial structure determines the mode of tumour evolution and Waclaw et
      al. (2015) that dispersal and turnover determine the speed at which resistance sweeps, yet every
      steering or scheduling formulation in this chapter uses a well-mixed or SSWM population. There is no
      optimal-control theory for resistance in a spatially structured (free-boundary or deme-structured)
      tumour.
    chapter: stochastic-evolution
    notes:
      - neutral-evolution-debate
      - evolutionary-steering-collateral-sensitivity
    status: open
  - title: Genetic and non-genetic resistance are modelled separately
    body: |-
      Branching-process models of mutation (Bozic et al. 2013) and models of reversible phenotypic
      switching (Gunnarsson et al. 2020, 2025) run in parallel literatures. The 2026 survey found no model
      that combines a Luria-Delbrück mutation calculation with a fast reversible switching layer and then
      derives the optimal schedule — although the clinical question, whether a persister population buys
      time for a permanent mutation, is exactly about the coupling.
    chapter: stochastic-evolution
    notes:
      - branching-process-resistance
      - persisters-phenotypic-switching
    status: open
  - title: A dynamic Stackelberg evolutionary game
    body: 'Stein et al. (2023) and Salvioli et al. (2025) solve a static bilevel problem: constant dose, follower
      at eco-evolutionary equilibrium. The dynamic version, a leader choosing $m(\cdot)$ against the Darwinian
      dynamics $\dot x=xG$, $\dot u=\sigma\partial_vG$, is an optimal control problem whose "follower" is a
      gradient flow rather than an optimiser. No existence result, necessary conditions or feedback (HJB)
      characterisation has been written for the G-function model; Gluzman, Scott and Vladimirsky (2020) solve
      an HJB equation only for a replicator model without an evolving continuous trait, and both SEG papers
      list the transient phase as future work.'
    chapter: evolutionary-games
    notes:
      - stackelberg-evolutionary-games
      - g-functions-darwinian-dynamics
    status: open
  - title: Identifiability of the G-function from assay data
    body: The game assay (Kaznatcheev et al. 2019) identifies two frequency-dependent growth-rate functions at one
      dose, density and environment. A Stackelberg design needs $G(v,\mathbf u,\mathbf x,m)$, and Theorem 4.1
      of Stein et al. (2023) says the Nash–Stackelberg gap hinges on $du^*/dm$, hence on
      $\partial_v\partial_mG$. No published result says which features of $G$ are identifiable from co-culture
      data, nor how to elicit the leader's objective weights $c_i$ that decide whether the gap is zero.
    chapter: evolutionary-games
    notes:
      - measuring-the-game
      - stackelberg-evolutionary-games
    status: open
  - title: Darwinian dynamics as a limit of trait-structured PDEs
    body: Bukkuri and Brown (2021) assert that $\dot u=\sigma^2\partial_vG$ is the small-mutation mean-field
      reduction of a trait-structured population equation and that integro-differential or reaction–diffusion
      models are needed otherwise. No cancer paper derives it as a moment closure with error bounds or
      compares SEG conclusions against a trait-structured PDE, although the constrained Hamilton–Jacobi theory
      of Dirac concentration provides the canonical equation with $(-D^2u)^{-1}$ in place of $\sigma^2$.
    chapter: evolutionary-games
    notes:
      - g-functions-darwinian-dynamics
      - stackelberg-evolutionary-games
    status: open
  - title: Validity of replicator-on-graph transforms for tumour parameters
    body: The Ohtsuki–Nowak transform used by Kaznatcheev, Scott and Basanta (2015) is a weak-selection
      pair-approximation result on regular graphs. Tumour simulations use strong selection and irregular
      (Voronoi) geometries, and no error estimate exists for that regime; Archetti (2016) shows numerically
      that geometry matters less than the nonlinearity of the benefit. Kaznatcheev (2018) adds that inverting
      the transform to recover the reductive game fails when spatial effects are slow and time-dependent.
    chapter: evolutionary-games
    notes:
      - spatial-games-in-tumours
      - measuring-the-game
    status: open
  - title: Structural stability of the double-goods cycles
    body: The polyclonal regime of Kaznatcheev et al. (2017) has a centre with closed orbits (a Hamiltonian system
      after a time change), and the treatment-timing conclusions rest on these cycles. Gerlee and Altrock
      (2017) show that replicator dynamics omit birth–death turnover; any such density term generically
      destroys a centre. Whether the timing conclusions survive as damped oscillations or a limit cycle is
      untested.
    chapter: evolutionary-games
    notes:
      - cancer-public-goods-games
    status: open
  - title: Stochastic and mean-field versions of the Stackelberg evolutionary game
    body: All SEG work is deterministic, and the cure region $x^*\le 0$ is exactly where deterministic models are
      least reliable; Gerlee and Altrock (2017) and Maltas et al. (2024) study stochastic extinction times
      only outside the leader–follower setting. A mean-field formulation (physician as major player, cells as
      a continuum of minor players with a trait distribution) was absent from the cancer-EGT literature; a
      first Stackelberg mean-field game for adaptive therapy appeared in 2026 (Mehrjou, ICML), and its
      relation to the G-function SEG is unexamined.
    chapter: evolutionary-games
    notes:
      - stackelberg-evolutionary-games
    status: partly answered
  - title: Reconcile containment and extinction in one control problem
    body: |-
      Containment theory (Viossat and Noble, 2021) maximises time to progression in a deterministic
      system and wants the burden as high as is tolerable, because competitive suppression is strongest
      there. Extinction theory (Patil, Ahmed, Viossat and Noble, 2026) maximises an extinction
      probability in a stochastic system and wants the burden low, because demographic accident only
      bites in small populations. Patil et al. attribute their disagreement with Gatenby et al. (2020)
      to different density-dependence and Allee-effect assumptions, and the in vivo strength of the
      Allee effect is unknown. No single formulation — a controlled density-dependent branching process,
      or a large-deviations analysis of the controlled ODE — exists in which "contain" and "extinguish"
      are two regimes of one problem with a characterised boundary in population size, turnover and
      Allee strength.
    chapter: adaptive-therapy
    notes:
      - extinction-therapy-two-strikes
      - tumour-containment-theory
      - adaptive-therapy-control
    status: open
  - title: Is containment a boundary arc or a singular arc?
    body: |-
      Viossat and Noble prove a pathwise optimality (hold $N = N_0$) by ODE comparison, with no
      Hamiltonian anywhere. In Pontryagin language that policy is a boundary arc of the state
      constraint $N \le N_{\mathrm{tol}}$, as in Greene, Sanchez-Tapia and Sontag (2020, Theorem 17), or
      a singular arc once the constraint is replaced by a cost. Missing is a theorem saying under which
      hypotheses on $(g_s, g_r)$ the sign of the Legendre–Clebsch quantity makes the singular arc
      optimal (metronomic dosing) rather than the boundary arc (containment). Such a statement would
      unify the containment literature with the geometric optimal-control literature.
    chapter: adaptive-therapy
    notes:
      - tumour-containment-theory
      - adaptive-therapy-control
      - bang-bang-singular-metronomic
    status: open
  - title: Which objective should be optimised?
    body: |-
      Three papers optimise three different functionals on essentially the same model: time to
      progression (Viossat and Noble, 2021; Phan et al., 2024), the time-integrated squared distance to
      a target equilibrium under a viability constraint (Cunningham et al., 2020), and cumulative hazard
      $\int_0^T h(N(t))\,dt$ (Mistry, 2020), with Wang, Scott and Vladimirsky (2024) adding probability
      of success within a budget. The optimal policy moves with the objective, and West et al. (2023,
      question 1) state explicitly that it is open whether to optimise survivorship or quality-adjusted
      survival. There is no comparative-statics theorem of the form "for hazard functions convex in
      burden the optimum is containment, for concave ones it is not", and no multi-objective analysis of
      these functionals on a common model.
    chapter: adaptive-therapy
    notes:
      - adaptive-therapy-control
      - tumour-containment-theory
      - adaptive-therapy-dynamic-programming
      - adaptive-therapy-trials-evidence
    status: open
  - title: Control under partial observation
    body: |-
      Every HJB policy in this chapter assumes exact knowledge of the subpopulation fractions. Gluzman,
      Scott and Vladimirsky (2020) call this impractical and say a rigorous treatment "requires
      partially observable controlled process theory", since decisions rest on scalar proxies such as
      PSA or cell-free DNA; Wang, Scott and Vladimirsky (2024) list intermittent measurements among
      their open problems, and Patil et al. (2026) note that the theoretically optimal second-strike
      time occurs when the tumour is likely undetectable. No filtering or POMDP formulation coupled to
      a cancer population model has appeared. A related gap: which combinations of growth rates,
      competition coefficients and carrying capacities are identifiable from one scalar biomarker
      trajectory under on/off control.
    chapter: adaptive-therapy
    notes:
      - adaptive-therapy-dynamic-programming
      - extinction-therapy-two-strikes
      - adaptive-therapy-trials-evidence
    status: open
  - title: Viability and controllable sets beyond two dimensions
    body: |-
      Carrère and Zidani (2020) and Thomsen and Dubbeldam (2025) characterise reachable and controllable
      sets, but both are planar. For the three-type Lotka–Volterra models of the prostate trial and for
      the three-strategy game of Gluzman et al., "incurable regions" are observed numerically and not
      characterised. Nor is there a viscosity-solution existence and uniqueness statement for the
      state-constrained exit-time HJB with $+\infty$ data on the failure set that Gluzman et al. solve
      numerically. Sun et al. (2025) show the related time-to-progression problem can fail to have an
      optimal strategy at all, requiring infinitely many holidays.
    chapter: adaptive-therapy
    notes:
      - adaptive-therapy-dynamic-programming
      - tumour-containment-theory
    status: partly answered
  - title: "Multidrug scheduling: taming $2^n$"
    body: |-
      With $n$ agents there are $2^n$ on/off combinations at each decision point, and West et al. (2023,
      question 8) ask how to limit that complexity, how to order and time agents to produce repeatable
      evolutionary cycles, and whether collateral sensitivity can be sequenced to steer evolution. The
      existing answers are heuristic (West et al., 2020: cycles and absorbing regions found by
      inspection, with tumour volume excluded) or restricted to perfect pairwise collateral sensitivity
      (Yoon, Krishnan and Scott, 2021). No feedback law over discrete treatment choices on a replicator
      state space with volume dynamics included has been computed. Viossat and Noble separately leave
      open whether continuous low-dose or intermittent high-dose containment is better.
    chapter: adaptive-therapy
    notes:
      - multidrug-adaptive-scheduling
      - adaptive-therapy-dynamic-programming
      - evolutionary-steering-collateral-sensitivity
    status: open
  - title: Does the Legendre–Clebsch sign decide between metronomic and containment?
    body: |-
      The two prescriptions that this literature produces are an interior singular arc (metronomic dosing)
      and a boundary arc of a state constraint (containment). Ledzewicz and Schättler (2014, 2017) find the
      singular arc optimal once a tumour is heterogeneous, while Greene, Sanchez-Tapia and Sontag (2020,
      Thm 16) find that in their induced-resistance model the candidate singular arcs violate the
      Legendre–Clebsch condition, so the boundary arc wins instead. What is missing is a theorem giving
      conditions on the growth and kill functions under which the Legendre–Clebsch quantity has one sign or
      the other. Such a result would also connect the containment theorems of Viossat and Noble (2021),
      which are proved pathwise without any Hamiltonian, to the Pontryagin syntheses.
    chapter: control
    notes:
      - bang-bang-singular-metronomic
      - drug-induced-resistance-control
    status: open
  - title: Which objective functional is the right one?
    body: |-
      Terminal burden, integral burden, time to a critical volume, cure probability, probability of success
      within a drug budget and distance to a target equilibrium all appear, and each moves the optimum.
      Engelhart, Lebiedz and Sager (2011) show this numerically across four models; Kuosmanen et al. (2021)
      get $u\approx 104.5$ maximising cure probability and $u\approx 60$ minimising the expected rescued
      population in the same model; Ledzewicz (2022) argues that quadratic drug costs are chosen for
      convenience. There is no multi-objective or Pareto analysis of these functionals on a common model,
      and no decision-theoretic argument for which is clinically appropriate.
    chapter: control
    notes:
      - bang-bang-singular-metronomic
      - numerical-optimal-control-methods
    status: open
  - title: Identifiability-aware optimal control
    body: |-
      The parameters that decide the structure of the optimum — competition strength, cost of resistance,
      induced-resistance rate — are the least constrained by data. Greene, Gevertz and Sontag (2019) prove
      structural identifiability of the induced-resistance rate $\alpha$ from total volume under several
      inputs, and Badri, Watanabe and Leder (2016) and Scagliotti et al. (2026) handle parametric
      uncertainty by chance constraints and by ensemble averaging. No work couples the two, i.e. chooses
      doses partly because they are informative about the parameters (dual or active control) while also
      treating the patient.
    chapter: control
    notes:
      - drug-induced-resistance-control
      - numerical-optimal-control-methods
    status: partly answered
  - title: Are singular protocols realizable, and how should they be repeated?
    body: |-
      Ledzewicz and Schättler note that singular controls, being state-feedback partial doses, "are not
      realizable", and answer with piecewise-constant approximations that lose less than a percent
      (J. Theor. Biol. 2008; Math. Biosci. Eng. 2011). What remains open is the multi-period question: in
      their own numerics a fixed on/rest ratio lets the tumour regrow by the fifth period unless the rest
      intervals are progressively shortened, and they state that "a more precise analysis of
      [multi-period scheduling] and comparisons with the other models still remains to be done".
    chapter: control
    notes:
      - anti-angiogenic-optimal-control
    status: partly answered
  - title: Optimal radiotherapy beyond a one-week horizon
    body: |-
      Leder et al. (2014) optimised one week of a 10 Gy course and state explicitly that "a simple
      repetition of the weekly schedule may not be optimal" for a full 60 Gy over six weeks; they also
      report that the global optimum was not computationally feasible to find, and that their schedules
      enrich stem-like cells and are not curative. The closed-form fractionation criterion of Unkelbach
      et al. (2013), by contrast, ignores population structure entirely. A schedule optimisation over a
      full course with both reversion dynamics and normal-tissue constraints has not been carried out.
    chapter: control
    notes:
      - radiotherapy-fractionation-control
    status: open
  - title: No optimal control of spatial tumour models
    body: |-
      Every synthesis in this chapter is for an ODE or trait-structured model. Space enters the
      radiotherapy thread only through dose statistics, via Unkelbach et al.'s effective sparing factor.
      There is no synthesis, and no PDE-constrained optimisation with structural results, for
      reaction–diffusion or free-boundary tumour models with the dose as control — an obvious gap given how
      developed both the spatial modelling and the PDE-control literatures are separately.
    chapter: control
    notes:
      - radiotherapy-fractionation-control
      - numerical-optimal-control-methods
    status: open
  - title: A PDE proof of uniqueness for the constrained Hamilton–Jacobi problem
    body: Perthame and Barles (2008) proved uniqueness only for separable $R$ and wrote that the general case was
      open. Calvez and Lam (2020) settled it for $H$ convex in $p$, decreasing in $I$ and $I\in BV$, but only
      through the variational (Lax–Oleinik) representation, and they ask to "by-pass the variational
      formulation and derive uniqueness from PDE arguments only". No comparison-principle proof is known, and
      nothing is known for systems with several multipliers, such as the healthy/cancer limit of Lorz et al.
      (2013) or Pouchol et al. (2018).
    chapter: phenotype-structured
    notes:
      - constrained-hj-uniqueness-regularity
      - lorz-clairambault-resistance-model
    status: partly answered
  - title: Which structure, short of concavity, prevents jumps of the multiplier?
    body: The multiplier $I(t)$ is Lipschitz under uniform concavity (Lorz, Mirrahimi, Perthame 2011; Mirrahimi,
      Roquejoffre 2016) and merely BV in general, with explicit jump examples (Perthame, Barles 2008). There
      is no intermediate theory, and the jumps are why Calvez, Hivert and Yoldaş (2023) obtain no convergence
      rate for their asymptotic-preserving scheme and no error estimate uniform in $\varepsilon$. The
      pessimization principle gives monotonicity of $I$ only for symmetric kernels; drug-induced advection
      (Chisholm et al. 2015) breaks it.
    chapter: phenotype-structured
    notes:
      - constrained-hj-uniqueness-regularity
      - persisters-phenotypic-switching
    status: open
  - title: Concentration with space beyond no-mutation or near-equilibrium data
    body: Mirrahimi and Perthame (2015) prove trait-space concentration without mutations and state that there is
      "no general compactness method" for nonlinear growth rates or trait-dependent dispersal; Jabin and
      Schram (2023) allow mutations but only under a smallness condition and prove local stability. The regime
      of the spheroid simulations (mutations, nonlinear nutrient feedback, non-concave fitness) is uncovered,
      and the invasion-front limit of Lorenzi, Perthame and Ruan (2022), an HJ equation in the trait with
      transport in space and a constraint only on the support, has no existence or uniqueness theory.
    chapter: phenotype-structured
    notes:
      - space-and-trait-models
    status: open
  - title: Dynamic programming for the control of trait-structured populations
    body: Pouchol et al. (2018) prove quasi-optimality of a two-phase schedule by Pontryagin on the reduced ODE
      plus a Lyapunov concentration argument. There is no HJB equation or verification theorem on the
      infinite-dimensional state, no existence or maximum principle for the state-constrained IDE problem, and
      nothing on control of the limiting constrained HJ system, where the dose enters $R(x,I,u)$ and the state
      is itself a viscosity solution. The authors also leave open the asymptotics of the PDE with epimutations
      and whether its optimal controls converge to the IDE ones as the epimutation rates vanish.
    chapter: phenotype-structured
    notes:
      - pouchol-optimal-control-ide
      - constrained-hj-uniqueness-regularity
    status: open
  - title: Periodic control of a nonlinear selection equation (chronotherapy meets resistance)
    body: The cell-cycle chronotherapy models are linear and the objective is a Floquet eigenvalue (Clairambault,
      Michel, Perthame 2006; Clairambault, Gaubert, Perthame 2007), with no universal Floquet/Perron ordering
      once transition rates are controlled (Clairambault, Gaubert, Lepoutre 2009). The resistance models are
      nonlinear and, under periodic forcing, their HJ limit uses the time-averaged fitness (Figueroa Iglesias,
      Mirrahimi 2018). No paper combines phase structure, a resistance trait and a periodic drug schedule,
      which would be an optimal periodic control problem for a nonlocal selection equation.
    chapter: phenotype-structured
    notes:
      - cell-cycle-chronotherapy
      - space-and-trait-models
    status: open
  - title: Identifying plasticity before choosing a strategy, and coupling it to mutation
    body: West et al. (2023) list as open how to identify phenotypic plasticity in a specific tumour before
      choosing a schedule; Gunnarsson et al. (2020, 2025) show that switching alone can sustain resistance and
      that the optimal dose steers to an equilibrium mixture. No model combines a Luria–Delbrück mutation
      layer with a fast reversible switching layer and derives the resulting optimal schedule, although the
      clinical question is exactly whether a persister population buys time for a permanent mutation.
    chapter: phenotype-structured
    notes:
      - persisters-phenotypic-switching
    status: open
  - title: Is immune control identifiable from tumour load, as a theorem?
    body: "Fassoni, Roeder and Glauche (2019) and Hähnel et al. (2020) find empirically that the immune parameters
      deciding relapse after TKI cessation cannot be recovered from BCR-ABL time courses under full dose, and
      Fassoni et al. (2025) that the information appears only after a dose reduction. No
      structural-identifiability analysis of the window-shaped recruitment $G(Y)$ exists: which combinations
      of $(p_Z, K_Z, m_K)$ are observable from pre-cessation data, and whether the twelve-month half-dose
      protocol is informative in principle, is not settled."
    chapter: tumor-immune
    notes:
      - cml-dynamics-treatment-free-remission
    status: open
  - title: An HJB or viscosity formulation of reach-the-basin immunotherapy control
    body: Every verified control paper, from Burden, Ernstberger and Fister (2004) to Mazel et al. (2026), uses
      Pontryagin's principle with numerical boundary-value solves; Ledzewicz, Naghnaeian and Schättler (2012)
      give a regular synthesis in which the saddle's stable manifold acts as a cut locus. The natural problem,
      minimal-cost or minimal-time transfer into the basin of the benign equilibrium under a toxicity state
      constraint, is a reachability problem whose value function and its behaviour across the separatrix have
      not been studied with viscosity-solution tools. The turnpike result of Mazel et al. (2026) is the first
      step in that direction.
    chapter: tumor-immune
    notes:
      - immunotherapy-optimal-control
      - kuznetsov-tumour-immune-model
    status: open
  - title: Optimal control of an extinction probability, and metastability
    body: Kimmel, Locke and Altrock (2021) show that in their CAR-T model eradication is deterministically
      unstable and define cure as a stochastic event below about 100 cells, but do not optimise over
      schedules; Baar et al. (2016) state that metastability in the large-$K$ limit raises new mathematical
      challenges. A formulation in which lymphodepletion timing and CAR-T dose are controls and the objective
      is an extinction probability (branching approximation near zero, or Freidlin–Wentzell exit asymptotics
      for sneaking through) does not exist in the verified literature.
    chapter: tumor-immune
    notes:
      - immune-evasion-games-car-t
      - immunotherapy-optimal-control
    status: open
  - title: Are tumour–immune oscillations real, and if so are they delay- or immune-induced?
    body: Eftimie, Bramson and Earn (2011) and Kareva et al. (2021) note that sustained tumour-size oscillations
      predicted by predator–prey models are not observed in solid tumours. In CML, low-level BCR-ABL
      fluctuations are read as immune-window periodic orbits by Fassoni et al. (2024) and as delayed-feedback
      Hopf oscillations in the Mackey line (Colijn and Mackey 2005); no verified model combines cell-cycle
      delay with window-shaped immune recruitment, so which mechanism produces the observed fluctuations is
      undecided.
    chapter: tumor-immune
    notes:
      - kuznetsov-tumour-immune-model
      - cml-dynamics-treatment-free-remission
      - leukaemia-stem-cell-models
    status: open
  - title: Evolutionary games with an immune predator
    body: Bayer, Brown and Staňková (2018) is the only verified paper coupling phenotype replicator dynamics to an
      immune population, and it proves monomorphic stability only for its chosen payoffs. No paper combines
      the Stackelberg adaptive-therapy framework with an immune compartment, or establishes evolutionary
      stability when fitness includes a saturating or ratio-dependent predation term; the
      Almeida–Audebert–Leschiera–Lorenzi (2022) antigen/TCR coevolution PDE and the George–Levine (2018)
      escape probability are ingredients of such a theory but have not been joined.
    chapter: tumor-immune
    notes:
      - immune-evasion-games-car-t
    status: open
  - title: Free-boundary regularity with a diffusing nutrient
    body: Mellet, Perthame and Quirós (2017) prove $C^1$ regularity of the Hele-Shaw tumour boundary only for a
      Lotka–Volterra source and $d\le3$, and islands can nucleate at singular times. Jacobs, Kim and Tong
      (2022) obtain contraction and patch regularity only with a non-diffusing nutrient and no death, Kim and
      Lelmi (2022) only Hausdorff closeness for small nutrient diffusion, and Feng, He, Liu and Zhou (2024/25)
      exhibit nonsymmetric travelling waves, an intrinsic boundary instability of the diffusing-nutrient
      model. Whether the instability is Saffman–Taylor-like, with a well-posed regularised problem, is
      unknown.
    chapter: spatial-mechanical
    notes:
      - hele-shaw-limit-tumour-growth
    status: open
  - title: Two-species Hele-Shaw limit with Darcy coupling in dimension two or more
    body: Bubba, Perthame, Pouchol and Schmidtchen (2020) prove the two-species limit in one dimension only,
      without a comparison principle or an Aronson–Bénilan estimate. Dębiec, Perthame, Schmidtchen and
      Vauchelet (2021) remove the dimension restriction only for Brinkman coupling, where the pressure may
      jump at the edge of each species' support. The Darcy limit in $d\ge2$ with mixed data, and whether the
      interface between the species is a hypersurface rather than merely a $BV$ set, are open.
    chapter: spatial-mechanical
    notes:
      - hele-shaw-limit-tumour-growth
    status: open
  - title: Uniqueness and a viscosity theory for the Hele-Shaw tumour problem with rough data
    body: Perthame, Quirós and Vázquez (2014) prove uniqueness only for pairs with uniformly compact supports and
      $\partial_tp,\partial_t\rho$ bounded measures; Guillen, Kim and Mellet (2022) need injection boundary
      data and $BV$ sources. Kim and Požár (2018) and Turanova and Zhang (2026) build viscosity-solution
      theories for special cases. A comparison theory covering sources depending on the pressure and on a
      nutrient, in $d\ge2$, is missing.
    chapter: spatial-mechanical
    notes:
      - hele-shaw-limit-tumour-growth
    status: partly answered
  - title: The nonlinear fate of the first shape instability of the spherical tumour
    body: "Friedman and Reitich (2000) prove that non-radial stationary branches bifurcate from the sphere at each
      mode $n\\ge2$, and Friedman and Hu (2006) locate the stability threshold $\\mu_*$ at the $n=2$ mode.
      Friedman's surveys (2004, 2007) list what is not known: global existence for non-radial data and what
      the $n=2$ instability does beyond the bifurcation point (dormant non-spherical shapes, self-similar
      growth or fingering), which Cristini, Lowengrub and Nie (2003) see only numerically."
    chapter: spatial-mechanical
    notes:
      - greenspan-free-boundary-models
    status: open
  - title: Control of the Hele-Shaw limit and a Hellinger–Kantorovich mean-field control problem
    body: "Optimal control is rigorous for diffuse-interface models (Colli, Gilardi, Rocca and Sprekels 2017 and
      the school that followed) and for a radial multilayer free-boundary model (Zhao et al. 2024), but not
      for the Hele-Shaw limit with a drug acting on the growth rate: no existence of optimal controls, no
      optimality system, no convergence of the controlled stiff-pressure problems to a controlled limit. The
      gradient-flow structure of Di Marino and Chizat (2020) and the JKO-with-source scheme of Jacobs, Kim and
      Tong (2021) suggest a mean-field control problem on the Hellinger–Kantorovich space, which has not been
      written."
    chapter: spatial-mechanical
    notes:
      - tumour-growth-unbalanced-transport
      - hele-shaw-limit-tumour-growth
      - phase-field-and-mixture-models
    status: open
  - title: Sharp-interface limits of Cahn–Hilliard–Darcy tumour models with chemotaxis
    body: Garcke, Lam, Sitka and Styles (2016) analyse the stability of radial solutions only for the formal
      sharp-interface model and pose the rigorous limit $\varepsilon\to0$ of the chemotactic
      Cahn–Hilliard–Darcy model as future work. No paper in the survey analyses the sharp-interface limit
      under control, so the diffuse-interface optimality systems and the free-boundary models remain
      unconnected.
    chapter: spatial-mechanical
    notes:
      - phase-field-and-mixture-models
      - greenspan-free-boundary-models
    status: open
  - title: Which coefficients of a tumour PDE can two images determine?
    body: >-
      The clinical glioma line calibrates exactly two scalars, $D$ and $\rho$, from the speed of the visible
      radius

      (two scans) and the separation of two level sets (one scan); single-scan methods (Lipková et al. 2019;

      Scheufele et al. 2021) need priors or a second modality. There is no identifiability theorem stating
      which

      functionals of $(D(x),\rho(x),c_0)$ two level-set observations determine, and the mechanics-coupled
      models

      used in digital twins (Jarrett et al. 2021) add a stress-dependent diffusion and an elastic coupling
      that

      appear structurally non-identifiable from volume data alone (survey assessment). West et al. (2023,
      question 9)

      state the rule that correlated parameters must not be estimated jointly, but no paper derives the
      identifiable

      combinations; OPAL (Lima et al. 2017) selects models without testing this.
    chapter: spatial-mechanical
    notes:
      - glioma-reaction-diffusion-personalisation
      - digital-twins-oncology
    status: open
  - title: A rigorous theory for coupled network–tissue angiogenesis
    body: >-
      Anderson–Chaplain (1998) angiogenesis is a PDE discretised into a random walk of sprout tips, and
      Macklin et al.

      (2009) couple the resulting discrete network with blood flow to a continuum tissue solver. Everything is

      computational: no well-posedness result for the coupled problem, no limit as the network becomes dense,
      and the

      phase-field angiogenesis models (Travasso et al. 2011) lack even existence results in the literature
      surveyed.

      The ODE abstraction (Hahnfeldt et al. 1999) is what control theory uses instead.
    chapter: spatial-mechanical
    notes:
      - invasion-and-angiogenesis-models
    status: open
  - title: "Spatial metastasis: placing lesions and growing them"
    body: >-
      The Iwata (2000) transport equation with self-seeding is well-posed (Barbolosi et al. 2009) and
      calibrated in

      mice and patients (Hartung et al. 2014; Benzekry et al. 2016; Bilous et al. 2019), but has no space:
      metastases

      are placed nowhere. Newton et al. (2012, 2013) place them by a Markov chain on anatomical sites but do
      not grow

      them. A model in which lesions are placed by a transport or Markov mechanism and each follows a local
      growth PDE,

      under one systemic control observed through one aggregate biomarker, has no analysis; West et al. (2023,

      question 10, citing Gallaher et al. 2022) note that many small lesions behave differently from few large
      ones

      while models treat burden as a scalar.
    chapter: spatial-mechanical
    notes:
      - metastasis-models
    status: open
  - title: How strong is the Allee effect at the invasion front, and does it decide the front's shape?
    body: >-
      Gatenby–Gawlinski (1996) fronts are pulled, Fisher–KPP-type; with an Allee term they become bistable,
      and

      Carter et al. (2025) show that a cell-free gap then destabilises planar fronts transversally, giving
      fingers.

      West et al. (2023, question 1) state that the in vivo strength of the Allee effect is unknown, although
      it also

      decides whether adaptive-therapy conclusions survive. Whether the fingering seen in invasive tumours is
      this

      instability, a Saffman–Taylor-type mechanical one (free-boundary and Hele-Shaw models), or environmental

      selection (Anderson et al. 2006) is not settled.
    chapter: spatial-mechanical
    notes:
      - invasion-and-angiogenesis-models
    status: open
  - title: From static to closed-loop decisions in digital twins
    body: >-
      Chaudhuri et al. (2023) optimise a radiotherapy regimen once, under posterior uncertainty, after
      calibration to

      one patient's MRI. The digital-twin framework of Wu et al. (2022) is explicitly iterative, data arriving
      and the

      digital state being updated, but no oncology twin yet re-optimises the regimen after each scan as a
      dynamic

      programme with the posterior as state, nor states what monitoring frequency makes this worthwhile. West
      et al.

      (2023, question 11) add that clinical data are collected at times of little value to modellers, so the
      data

      schedule is itself part of the design problem.
    chapter: spatial-mechanical
    notes:
      - digital-twins-oncology
    status: open
  - title: How does the optimal dosing policy depend on the objective functional?
    body: >-
      Three different functionals have been optimised on essentially the same two- or three-type competition
      model:

      time to progression (Viossat & Noble 2021; Phan et al. 2024/2026), squared distance to a target
      coexistence

      equilibrium under a viability constraint (Cunningham et al. 2020), and cumulative hazard

      $\int_0^T h(N(t))\,dt$ (Mistry 2020). Each yields a different recommendation, and the clinical dispute
      is

      therefore a dispute about the objective. What is missing is comparative statics: a theorem of the form

      "for hazard functions $h$ convex in burden the optimum is a boundary (containment) arc, for $h$ concave
      it is

      bang-bang", together with the quality-adjusted objective that would reconcile the Gatenby and Mistry
      positions.
    chapter: clinical
    notes:
      - adaptive-therapy-trials-evidence
      - field-open-questions
    status: open
  - title: Control structure and an HJB verification theorem for the three-type prostate model
    body: >-
      Cunningham et al. (2020) find a monotone titration numerically; the clinic uses on/off; Phan et al.
      (2024/2026)

      find a corner in threshold space. For the model actually used in the trial — where the dose enters the
      carrying

      capacities, $K_{TP} \propto (1-\Lambda)$, rather than as a death rate — nobody has proved whether the
      optimum

      is bang-bang, singular or a boundary arc of the state constraint $N \le B_{\max}$, and there is no
      verification

      theorem via a constrained HJB equation (Soner-type boundary conditions). The companion question is the

      restriction to feedback-threshold policies: regularity of the threshold-to-failure-time map across its
      switching

      surfaces, existence of optimal thresholds, and a bound on the loss from the restriction.
    chapter: clinical
    notes:
      - adaptive-therapy-trials-evidence
      - adaptive-therapy-dynamic-programming
      - field-open-questions
    status: open
  - title: Identifiability of competition coefficients from a scalar biomarker
    body: >-
      Zhang et al. (2017) set the $\alpha_{ij}$ by expert judgement; Zhang et al. (2022) estimate one global
      asymmetry

      (~6:1) across all patients, which the eLife referees objected to; Phan et al. estimate
      $\alpha_{RS}\approx 5.2$

      as a population parameter. The observation is the scalar $P \approx (\lambda/\Xi)\sum_i x_i$. No
      structural

      identifiability analysis exists for a Lotka–Volterra system observed only through that scalar: which

      combinations of $(r_i,\alpha_{ij},K_i)$ are identifiable from one trajectory under on/off control, and
      whether

      switching the control adds identifiability. West et al. (2023, Q9) state the rule that correlated
      parameters

      must not be jointly estimated, but derive no identifiable combinations.
    chapter: clinical
    notes:
      - adaptive-therapy-trials-evidence
      - field-open-questions
      - digital-twins-oncology
    status: open
  - title: "Coarse-graining: where do the competition coefficients come from?"
    body: >-
      Silva et al. (2012) use frequency-dependent competition, Zhang et al. density-dependent carrying
      capacities, and

      West et al. (2023, Q10) note the benefit argument depends on which is used. Kaznatcheev's
      effective-games work

      argues the postulated form is generally wrong, and Gallaher et al. (2018) and Strobl et al. (2022) show
      spatial

      structure changes the effective cost of resistance — so $\alpha_{ij}$ is a property of the geometry, not
      of the

      cells. Missing: a hydrodynamic-limit theorem giving $\alpha_{ij}$, and its frequency- or
      density-dependent form,

      as a functional of the spatial interaction kernel and the spatial measure.
    chapter: clinical
    notes:
      - field-open-questions
      - spatial-games-in-tumours
      - measuring-the-game
    status: open
  - title: One control problem containing both containment and extinction
    body: >-
      Viossat & Noble (2021) maximize time to progression in a deterministic ODE; Patil, Ahmed, Viossat &
      Noble (2025)

      maximize an extinction probability using evolutionary-rescue theory with Gillespie checks, and attribute
      their

      disagreement with Gatenby et al. (2020) to different density-dependence and Allee assumptions.
      Deterministic

      containment models cannot even express the extinction question. Missing: a single formulation — a
      controlled

      branching process with density-dependent rates, or a large-deviations analysis of the ODE — in which
      "contain"

      and "extinguish" are two regimes of one control problem, with the boundary characterized in terms of
      population

      size, turnover and Allee strength.
    chapter: clinical
    notes:
      - extinction-therapy-two-strikes
      - tumour-containment-theory
      - field-open-questions
    status: open
  - title: A posterior over policies, and the multi-lesion problem
    body: >-
      West et al. (2023, Q11) and Hormuth et al. in the 2019 roadmap both require predictions with rigorous

      uncertainty quantification, and Anderson & Gatenby ask for ensemble treatment plans, yet the
      trial-facing papers

      report point predictions from point estimates. The missing object is a posterior over policies: given a
      Bayesian

      posterior over $(r_i,\alpha_{ij},K_i)$ from sparse biomarker data, the policy maximizing expected

      quality-adjusted survival, plus the value of information from an extra measurement — a partially
      observed

      stochastic control problem. The same gap has a spatial form: metastatic disease is one systemic control
      acting on

      several coupled local dynamics observed through one aggregate biomarker (Gallaher et al. 2022: many
      small lesions

      behave differently from few large ones), which is a decentralized-control and aggregation problem nobody
      has

      formulated.
    chapter: clinical
    notes:
      - field-open-questions
      - digital-twins-oncology
      - adaptive-therapy-trials-evidence
    status: open
  - title: An MFG or mean-field control problem with birth and death
    body: >-
      Any cell-population forward equation has a growth term $m\,R(x,I,d)$, so $m_t$ is not a probability
      measure and the

      Lasry–Lions framework does not apply as stated. Di Marino and Chizat (2020) show the Hele-Shaw tumour
      model is a

      gradient flow for the Hellinger–Kantorovich metric, but no HJB or master-equation theory exists on that
      cone of

      nonnegative measures, and nobody has used the EVI structure of the follower dynamics in a leader's
      uniqueness argument.
    chapter: mean-field-and-beyond
    notes:
      - mean-field-games-in-oncology
    status: open
  - title: Is adaptive therapy a mean field game or a mean-field control problem?
    body: >-
      A genuine MFG requires the minor players to optimise. Cells follow Darwinian dynamics (a myopic gradient
      ascent) or

      a Fokker–Planck equation; no biological derivation of a forward-looking cell objective exists. Mehrjou
      (2026) states

      a Stackelberg MFG with an $O(N^{-1/2})$ finite-player rate in a workshop abstract; the defensible
      formulation is

      mean-field control of a McKean–Vlasov population with common noise and partial (PSA-type) observation,
      which has not

      been written down for cancer.
    chapter: mean-field-and-beyond
    notes:
      - mean-field-games-in-oncology
    status: open
  - title: A dynamic Stackelberg evolutionary game and the chattering obstruction
    body: >-
      Stein et al. (2023) ask for the move from equilibrium leader–follower games to dynamic ones. Existence
      of an

      open-loop Stackelberg equilibrium in which the leader commits to a dose path and the follower trait
      follows Darwinian

      dynamics has not been proved, and Sun et al. (2025) show that the time-to-progression optimum can
      require infinitely

      many treatment holidays, so a relaxed-control or minimum-dwell-time formulation is needed first.
    chapter: mean-field-and-beyond
    notes:
      - mean-field-games-in-oncology
    status: open
  - title: A partially observed or robust (HJI) formulation of adaptive therapy
    body: >-
      Gluzman, Scott and Vladimirsky (2020) and Wang, Scott and Vladimirsky (2024) both list partial
      observability (PSA,

      cfDNA proxies) and worst-case parameters via Hamilton–Jacobi–Isaacs equations as open. Carrère and
      Zidani (2020)

      treat reachability under uncertainty for a two-type model, and Fischer, Vázquez-García and Mustonen
      (2015) show

      numerically how control is lost under sparse monitoring, but no filtering or game-against-nature theory
      exists at the

      population level.
    chapter: mean-field-and-beyond
    notes:
      - mean-field-games-in-oncology
      - control-of-evolving-populations
    status: open
  - title: Optimal control of the genotype distribution on a space of measures
    body: >-
      Fischer et al. (2015), Weaver et al. (2024) and Chen et al. (2026) solve finite-state Bellman or MDP
      problems;

      Iram et al. (2021) prescribe the path of the Wright–Fisher density and solve for the control (an inverse
      problem).

      The value function $V(t,p)$ on probability measures over the genotype simplex, with the controlled
      Fokker–Planck

      operator as dynamics, and its Benamou–Brenier-type steering version between two equilibria, have no
      formulation or

      viscosity theory.
    chapter: mean-field-and-beyond
    notes:
      - control-of-evolving-populations
    status: open
